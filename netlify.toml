# Configuración de Netlify para LauStore
[build]
  publish = "."
  functions = "netlify/functions"

# Permisos especiales para el módulo de inventario móvil (cámara y micrófono)
[[headers]]
  for = "/inventario/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(self), microphone=(self)"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

# Headers para las funciones serverless
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Pin"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"

# Headers de seguridad generales para el resto del sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirección de fallback para páginas no encontradas
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
